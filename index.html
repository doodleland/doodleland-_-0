<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coloring World</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{min-height:100vh;background-color:light-dark(#fff9f0,#171717);color:light-dark(#26221d,#f5f1ea);padding:28px}header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.brand span{display:inline-block;margin-right:8px}.tag{font-size:13px;color:light-dark(#756b61,#bdb5aa)}button{font:inherit;border:0;cursor:pointer}.pill{padding:10px 16px;border-radius:999px;background:light-dark(#26221d,#f5f1ea);color:light-dark(#fff,#171717);font-weight:700}.hero{max-width:1100px;margin:48px auto 30px}.hero h1{font-size:clamp(40px,7vw,76px);line-height:.95;margin:0 0 14px;letter-spacing:-4px}.hero p{font-size:18px;color:light-dark(#6d635a,#bdb5aa);max-width:650px}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:light-dark(#fff,#202020);border:1px solid light-dark(#eee5da,#333);border-radius:24px;padding:16px;box-shadow:0 10px 30px #00000008;transition:.2s}.card:hover{transform:translateY(-3px)}.preview{height:180px;border-radius:17px;background:#fffdf8;display:grid;place-items:center;border:2px dashed #ddd3c7}.preview svg{width:78%;height:78%}.card h3{margin:14px 2px 4px}.card p{margin:0 2px 12px;color:light-dark(#82786e,#aaa39b);font-size:14px}.open{width:100%;padding:11px;border-radius:13px;background:light-dark(#f0e8dc,#302d29);color:inherit;font-weight:750}.editor{display:none;max-width:1100px;margin:28px auto}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}.toolbar button{padding:9px 13px;border-radius:12px;background:light-dark(#fff,#252525);color:inherit;border:1px solid light-dark(#e6ddd2,#3b3936)}.colors{display:flex;gap:7px;align-items:center;margin-left:auto}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}.swatch.active{border-color:light-dark(#222,#fff)}canvas{display:block;width:100%;max-width:800px;margin:auto;background:#fff;border-radius:22px;touch-action:none;box-shadow:0 10px 40px #0002}.back{margin-bottom:10px}
@media(max-width:650px){#app{padding:18px}.hero{margin-top:35px}.hero h1{letter-spacing:-2px}.colors{width:100%;margin-left:0;overflow:auto}}
</style>
</head>
<body><main id="app">
<header><div><div class="brand"><span>✦</span>Coloring World</div><div class="tag">Ad-free • simple • creative</div></div><button class="pill" onclick="showHome()">Home</button></header>
<section class="hero" id="home"><h1>Pick a page.<br>Make it yours.</h1><p>Choose a coloring page, paint it right here, undo mistakes, clear the canvas, and save your masterpiece. No ads. Ever.</p></section>
<section class="grid" id="cards"></section>
<section class="editor" id="editor"><button class="toolbar back" onclick="showHome()">← Back to pages</button><div class="toolbar"><strong id="title">Coloring page</strong><button onclick="undo()">↶ Undo</button><button onclick="clearCanvas()">Clear</button><button onclick="saveCanvas()">Save PNG</button><div class="colors" id="colors"></div></div><canvas id="canvas" width="800" height="600"></canvas></section>
</main>
<script>
const pages=[
 {name:'Happy Sun',desc:'A bright little sun',svg:'<circle cx="150" cy="150" r="62" fill="none" stroke="#222" stroke-width="7"/><g stroke="#222" stroke-width="7" stroke-linecap="round"><path d="M150 48v-25M150 277v-25M48 150H23M277 150h-25M78 78 60 60M240 240l-18-18M222 78l18-18M78 222l-18 18"/></g><circle cx="128" cy="140" r="6"/><circle cx="172" cy="140" r="6"/><path d="M125 170q25 25 50 0" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>'},
 {name:'Cute Cat',desc:'A fluffy friend',svg:'<path d="M70 95 85 30l50 38q25-12 50 0l50-38 15 65q18 35 0 75-30 62-90 62t-90-62q-18-40 0-75z" fill="none" stroke="#222" stroke-width="7"/><circle cx="125" cy="130" r="6"/><circle cx="195" cy="130" r="6"/><path d="M150 145l-10 10h20zM150 155q-15 20-32 4M150 155q15 20 32 4" fill="none" stroke="#222" stroke-width="5" stroke-linecap="round"/><path d="M100 153H55M200 153h45" stroke="#222" stroke-width="4"/></svg>'},
 {name:'Rocket',desc:'Blast off!',svg:'<path d="M150 25q75 70 45 170l-45 75-45-75Q75 95 150 25z" fill="none" stroke="#222" stroke-width="7"/><circle cx="150" cy="115" r="25" fill="none" stroke="#222" stroke-width="6"/><path d="M105 170 65 205v-45M195 170l40 35v-45M120 240l-20 65 50-40 50 40-20-65" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/></svg>'},
 {name:'Butterfly',desc:'A garden favorite',svg:'<path d="M150 145q-35-100-105-90-35 5-25 55 10 48 100 70M150 145q35-100 105-90 35 5 25 55-10 48-100 70M150 145q-25 55-75 70-35 10-30-20 8-45 105-50M150 145q25 55 75 70 35 10 30-20-8-45-105-50" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round"/><ellipse cx="150" cy="150" rx="12" ry="55" fill="none" stroke="#222" stroke-width="6"/></svg>'}
];
const palette=['#111111','#e63946','#ff9f1c','#ffd166','#2a9d8f','#2f80ed','#7b61ff','#ef5da8','#7a4e2d','#55b948'];let current='#111111',drawing=false,last=null,history=[];const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
function renderCards(){document.getElementById('cards').innerHTML=pages.map((p,i)=>`<article class="card"><div class="preview"><svg viewBox="0 0 300 300">${p.svg}</svg></div><h3>${p.name}</h3><p>${p.desc}</p><button class="open" onclick="openPage(${i})">Color this page →</button></article>`).join('')}
function makeColors(){document.getElementById('colors').innerHTML=palette.map(c=>`<button class="swatch ${c===current?'active':''}" style="background:${c}" onclick="pick('${c}')" aria-label="color"></button>`).join('')}
function openPage(i){document.getElementById('home').style.display='none';document.getElementById('cards').style.display='none';document.getElementById('editor').style.display='block';document.getElementById('title').textContent=pages[i].name;ctx.clearRect(0,0,800,600);ctx.fillStyle='#fff';ctx.fillRect(0,0,800,600);ctx.save();ctx.translate(250,90);ctx.scale(1.7,1.7);drawSVG(pages[i].svg);ctx.restore();history=[];makeColors()}
function drawSVG(raw){const blob=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">${raw}</svg>`],{type:'image/svg+xml'});const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,300,300);img.src=URL.createObjectURL(blob)}
function pick(c){current=c;makeColors()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);history.push(ctx.getImageData(0,0,canvas.width,canvas.height))});canvas.addEventListener('pointerup',()=>{drawing=false;last=null});canvas.addEventListener('pointerleave',()=>drawing=false);canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle=current;ctx.lineWidth=14;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
function undo(){if(history.length){ctx.putImageData(history.pop(),0,0)}}function clearCanvas(){history.push(ctx.getImageData(0,0,canvas.width,canvas.height));ctx.fillStyle='#fff';ctx.fillRect(0,0,800,600)}function saveCanvas(){const a=document.createElement('a');a.download='my-coloring.png';a.href=canvas.toDataURL('image/png');a.click()}function showHome(){document.getElementById('home').style.display='block';document.getElementById('cards').style.display='grid';document.getElementById('editor').style.display='none'}renderCards();makeColors();
</script></body></html>
